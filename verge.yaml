mixed-port: 7890
allow-lan: true
mode: rule
log-level: debug
ipv6: false

sniffing:
  enable: true
  sniff:
    HTTP:
      ports: [80]
    TLS:
      ports: [443, 8443]
  override-destination: true  # 用嗅探结果替换 Fake-IP 目标

# 通用 TUN 配置：兼顾 Windows 高性能与 Android 稳定性
tun:
  enable: false
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  bypass-lan-addresses: true
  dns-hijack:
    - 198.18.0.1:53
  strict-route: false
  mtu: 1420

dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  ipv6: false
  use-hosts: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  
  fallback:
    - 223.5.5.5
    - 119.29.29.29
    - tls://dot.pub          # 如果你想国内也用加密，换这个
    - tls://dns.alidns.com

  # 关键修复：确保微软/苹果服务不走 Fake-IP 逻辑，直接由系统握手
  fake-ip-filter:
    - '*.msftncsi.com'
    - 'msftconnecttest.com'
    - 'workplacejoin.microsoft.com'
    - '*.msftauth.net'
    - 'setup.icloud.com'
    - '+.apple.com'
    - '+.icloud.com'
    - '+.microsoft.com'
    - '+.live.com'
    - '+.office.com'
    - '+.onedrive.com'
    - '+.microsoftonline.com'
    - 'localhost.ptlogin2.qq.com' # 腾讯系某些登录校验
    - 'mirror.ghproxy.com'        # 常见代理工具地址
    - 'router.asus.com'           # 华硕路由器
    - 'router.login'              # 常用通用路由地址
    - 'tplinkwifi.net'            # TP-Link
    - '+.lan'                     # 局域网后缀
    - '+.local'                   # mDNS 常用后缀

  nameserver-policy:
    # 国内域名 → 明文
    "geosite:cn":
      - 223.5.5.5
      - 119.29.29.29

    "+.cn,+.bing.com,+.qq.com,+.weixin.qq.com,+.baidu.com,+.taobao.com,+.jd.com,+.bilibili.com,+.163.com,+.weibo.com":
      - 223.5.5.5
      - 119.29.29.29

    # 国外域名 → 只走加密
    "geosite:geolocation-!cn":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query

  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/8

# 严禁在 Hosts 里将域名指向 DNS 节点，仅保留基础回环
hosts:
  'localhost': 127.0.0.1

profile:
  store-selected: true

proxy-providers:
  my_subscription:
    type: http
    url: "https://api-huacloud.net/sub?target=clash&insert=true&emoji=true&udp=true&clash.doh=true&new_name=true&filename=Flower_Trojan.yaml&url=https%3A%2F%2Fapi.xmancdn.net%2Fosubscribe.php%3Ftoken2%3Dqem4z7rq-425d51bf0botcrpa5qt6gb"
    path: ./proxy_list.yaml
    interval: 3600
    header:
      User-Agent:
        - "clash-meta"
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300

proxy-groups:
  - name: AI
    type: url-test
    filter: "(?i)(US|英|UK|加拿|美|法|德|澳|德|韩|墨|巴|日|台|港|HK)"
    use: [my_subscription]
    url: https://cp.cloudflare.com/generate_204
    interval: 1800
    tolerance: 50
    lazy: true

  - name: Gemini
    type: url-test
    filter: "(?i)(US|英|UK|加拿|美|法|德|澳|德|韩|墨|巴|日|台|港|HK)"
    use: [my_subscription]
    url: https://cp.cloudflare.com/generate_204
    interval: 1800
    tolerance: 50
    lazy: true

  - name: Claude
    type: url-test
    filter: "(?i)(US|英|UK|加拿|美|法|德|澳|德|韩|墨|巴|日|台)"
    use: [my_subscription]
    url: https://cp.cloudflare.com/generate_204
    interval: 1800
    tolerance: 50
    lazy: true
    
  - name: 自动最快
    type: url-test
    use: [my_subscription]
    url: https://cp.cloudflare.com/generate_204
    interval: 1800
    tolerance: 50
    lazy: true

  - name: Direct
    type: select
    proxies:
      - DIRECT
      - 自动最快

rule-providers:
  AdBlock: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/AdBlock.yaml', path: ./Rules/AdBlock, interval: 86400 }
  Apple: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/Apple.yaml', path: ./Rules/Apple, interval: 86400 }
  AI: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/AI.yaml', path: ./Rules/AI, interval: 86400 }
  Microsoft: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/Microsoft.yaml', path: ./Rules/Microsoft, interval: 86400 }
  China: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/China.yaml', path: ./Rules/China, interval: 86400 }
  Gemini: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/Gemini.yaml', path: ./Rules/Gemini, interval: 86400 }
  AdBlock2: { type: http, behavior: domain, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/AdBlock_Rule2.yaml', path: ./Rules/AD2, interval: 86400 }
  Claude: { type: http, behavior: domain, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/Claude.yaml', path: ./Rules/Claude, interval: 86400 }

rules:
  - PROCESS-NAME,XFRHTXEx.exe,DIRECT
  - RULE-SET,AdBlock,REJECT,no-resolve
  - RULE-SET,AdBlock2,REJECT,no-resolve
  - RULE-SET,Gemini,Gemini       # ← AI 相关提前
  - RULE-SET,Claude,Claude
  - RULE-SET,AI,AI
  - DOMAIN-SUFFIX,cn,DIRECT,no-resolve
  - RULE-SET,Apple,DIRECT
  - RULE-SET,Microsoft,DIRECT
  - RULE-SET,China,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - GEOIP,LAN,DIRECT,no-resolve
  - MATCH,自动最快
