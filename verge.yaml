mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true

sniffing:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  override-destination: true  # 用嗅探结果替换 Fake-IP 目标

# 通用 TUN 配置：兼顾 Windows 高性能与 Android 稳定性
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  bypass-lan-addresses: true
  dns-hijack:
    - 'any:53' # 必须拦截 53 端口
    - 'tcp://any:53'
  strict-route: false
  mtu: 1420

dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  ipv6: false
  use-hosts: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  
  fallback:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    - tls://dot.pub
    - tls://dns.alidns.com

  # 关键修复：确保微软/苹果服务不走 Fake-IP 逻辑，直接由系统握手
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - 'localhost'
    - 'time.*.com'
    - 'time.*.gov'
    - 'time.*.edu.cn'
    - 'time.*.apple.com'
    - 'time1.*.com'
    - 'time2.*.com'
    - 'time3.*.com'
    - 'time4.*.com'
    - 'time5.*.com'
    - 'time6.*.com'
    - 'time7.*.com'
    - 'ntp.*.com'
    - 'ntp1.*.com'
    - 'ntp2.*.com'
    - 'ntp3.*.com'
    - 'ntp4.*.com'
    - 'ntp5.*.com'
    - 'ntp6.*.com'
    - 'ntp7.*.com'
    - '+.pool.ntp.org'
    - '+.anthropic.com'
    - '+.claude.ai'
    - '+.syncthing.net'
    - '*.msftncsi.com'
    - 'msftconnecttest.com'
    - '*.msftauth.net'
    - '+.apple.com'
    - '+.icloud.com'
    - 'login.microsoftonline.com'
    - '*.msauth.net'
    - '+.onedrive.com'
    - '+.microsoft.com'
    - '+.live.com'
    - '+.office.com'
    - '+.office365.com'
    - 'localhost.ptlogin2.qq.com' # 腾讯系某些登录校验
    - 'mirror.ghproxy.com'        # 常见代理工具地址
    - 'router.asus.com'           # 华硕路由器
    - 'router.login'              # 常用通用路由地址
    - 'tplinkwifi.net'            # TP-Link
    - '+.lan'                     # 局域网后缀
    - '+.local'                   # mDNS 常用后缀

  nameserver-policy:
    # 国内域名 → 明文
    "geosite:cn":
      - 223.5.5.5
      - 119.29.29.29

    "+.cn,+.bing.com,+.microsoft.com,+.msftauth.net,+.msauth.net,+.onedrive.com,+.office.com,+.office365.com,+.live.com,+.sharepoint.com,+.syncthing.net,+.qq.com,+.weixin.com,+.baidu.com,+.taobao.com,+.jd.com,+.bilibili.com,+.163.com,+.weibo.com":
      - 223.5.5.5
      - 119.29.29.29

    # 国外域名 → 只走加密
    "geosite:geolocation-!cn":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
      

  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/8

# 严禁在 Hosts 里将域名指向 DNS 节点，仅保留基础回环
hosts:
  'localhost': 127.0.0.1

profile:
  store-selected: true

proxy-providers:
  my_subscription:
    type: http
    url: "https://api-huacloud.net/sub?target=clash&insert=true&emoji=true&udp=true&clash.doh=true&new_name=true&filename=Flower_SS.yaml&url=https%3A%2F%2Fapi.xmancdn.net%2Fosubscribe.php%3Ftoken2%3Dqddz7jxq-a2c5fadb1bo0ra3xbs%26sip002%3D1"
    path: ./proxy_list1.yaml
    interval: 3600

  my_subscription_2:
    type: http
    url: "https://api2.riolu01.link/RioLU/system/api/v1/client/subscribe?token=98c5c846ed8d7dc606269e0daaae57a5"
    path: ./proxy_list2.yaml
    interval: 3600

proxy-groups:
  - name: AI
    type: url-test
    filter: "(?i)(US|英|UK|加拿|美|法|德|澳|德|韩|墨|巴|日|台|港|HK)"
    use: [my_subscription, my_subscription_2]
    url: https://cp.cloudflare.com/generate_204
    interval: 1800
    tolerance: 50
    lazy: true

  - name: Gemini
    type: url-test
    filter: "(?i)(US|英|UK|加拿|美|法|德|澳|德|韩|墨|巴|日|台|港|HK)"
    use: [my_subscription, my_subscription_2]
    url: https://cp.cloudflare.com/generate_204
    interval: 1800
    tolerance: 50
    lazy: true

  - name: Claude
    type: url-test
    filter: "(?i)(US|英|UK|加拿|美|法|德|澳|德|韩|墨|巴|日|台|印尼)"
    use: [my_subscription, my_subscription_2]
    url: https://cp.cloudflare.com/generate_204
    interval: 1800
    tolerance: 50
    lazy: true
    
  - name: 自动最快
    type: url-test
    use: [my_subscription, my_subscription_2]
    url: https://cp.cloudflare.com/generate_204
    interval: 1800
    tolerance: 50
    lazy: true

  - name: Direct
    type: select
    proxies:
      - DIRECT
      - 自动最快


rule-providers:
  AdBlock: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/AdBlock.yaml', path: ./Rules/AdBlock, interval: 864000 }
  Apple: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/Apple.yaml', path: ./Rules/Apple, interval: 864000 }
  AI: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/AI.yaml', path: ./Rules/AI, interval: 86400 }
  Microsoft: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/Microsoft.yaml', path: ./Rules/Microsoft, interval: 864000 }
  China: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/China.yaml', path: ./Rules/China, interval: 864000 }
  Gemini: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/Gemini.yaml', path: ./Rules/Gemini, interval: 864000 }
  AdBlock2: { type: http, behavior: domain, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/AdBlock_Rule2.yaml', path: ./Rules/AD2, interval: 864000 }
  Claude: { type: http, behavior: domain, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/Claude.yaml', path: ./Rules/Claude, interval: 864000 }

rules:
  - RULE-SET,Claude,Claude
  - DOMAIN-SUFFIX,syncthing.net,DIRECT,no-resolve
  - DOMAIN-SUFFIX,githubusercontent.com,自动最快
  - DOMAIN-SUFFIX,github.com,自动最快
  - DOMAIN-SUFFIX,api-flowercloud.com,自动最快

  - PROCESS-NAME,XFRHTXEx.exe,DIRECT
  - RULE-SET,AdBlock,REJECT,no-resolve
  - RULE-SET,AdBlock2,REJECT,no-resolve
  - RULE-SET,Reject,REJECT,no-resolve
  - RULE-SET,WeChat,DIRECT
  - RULE-SET,Direct,DIRECT
  - RULE-SET,Gemini,Gemini       # ← AI 相关提前
  - RULE-SET,AI,AI
  - DOMAIN-SUFFIX,cn,DIRECT,no-resolve

  - RULE-SET,Apple,DIRECT
  - RULE-SET,Microsoft,DIRECT
  - RULE-SET,China,DIRECT
  - RULE-SET,Proxy,自动最快
  - GEOIP,CN,DIRECT,no-resolve
  - GEOIP,LAN,DIRECT,no-resolve
  - MATCH,DIRECT

