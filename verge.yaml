mixed-port: 7890
allow-lan: true
mode: rule
log-level: warning
ipv6: false
sniffing:
  enable: true
  dest-ip: true
  route-only: false
tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  bypass-lan-addresses: true
  dns-hijack:                  # 强制劫持系统 DNS 到 Clash，防泄漏
    - any:53
    - tcp://any:53
  routing-mark: 666
  strict-route: true
  mtu: 1420

proxy-providers:
  Provider_A:
    type: http
    url: "https://sub.iplcsub20241025.top/qC8zV8qS1kB1lX2u/NXy2N9NFBWZrEcio?clash=1"
    interval: 36000
    path: ./provider_a.yaml
    health-check: {enable: true, interval: 600, url: http://www.gstatic.com/generate_204}
  Provider_B:
    type: http
    url: "https://subscription.riolu.link/RioLU/system/api/v1/client/subscribe?token=a5dbbf3cfc45326d3f7721c095fcc0d8"
    interval: 36000
    path: ./provider_b.yaml
    health-check: {enable: true, interval: 600, url: http://www.gstatic.com/generate_204}
  Provider_C:
    type: http
    url: "https://oics.net/api/v3/download.getFile/c883b0f3-3195-4d4e-9e38-a51f897290e0?clash=smart&lv=2%7C3.wav"
    interval: 36000
    path: ./provider_c.yaml
    health-check: {enable: true, interval: 600, url: http://www.gstatic.com/generate_204}

dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  ipv6: false
  use-hosts: true
  # 1. 基础 DNS：仅用于解析 DOH 域名
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 2. 国内解析器：Stash 会优先尝试这里的服务器
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 3. 国外/加密解析器：放在 fallback 中
  fallback:
    - 'https://sky.rethinkdns.com/dns-query'
    - 'https://223.5.5.5/dns-query'

  # 4. 关键逻辑：Stash 通过这个过滤器决定何时切换到 fallback
  # 如果解析结果是国内 IP，则信任 nameserver；如果是国外 IP 或被污染，则使用 fallback。
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcount-range: [223.5.5.5, 119.29.29.29]
    ipcidr:                                   # 加这个，防污染私有段
      - 240.0.0.0/4                           # 常见污染段
      - 224.0.0.0/4
# 强制让广告域名失效
    geosite:
      - category-ads-all
      - gfw

  # 5. 针对容易误伤的 .com 域名，在 hosts 中强制指定解析（替代 policy 的功能）
  # Stash 对 hosts 的支持非常完美
  hosts:
    '*.qq.com': 223.5.5.5
    '*.tencent.com': 223.5.5.5
    '*.apple.com': 223.5.5.5
    '*.abchina.com': 223.5.5.5
    '*.autonavi.com': 223.5.5.5

  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "dler.cloud"
    - "+.dler.cloud"
    - "stun.*"
    - "*.abchina.com"
    - "*.95599.cn"
    - "+.in-addr.arpa"
    - "+.arpa"
    - "localhost"
    - "127.*"
    - "10.*"
    - "172.16.*"
    - "192.168.*"



profile:
  store-selected: true

proxy-groups:
  - name: AI
    type: url-test
    filter: "(US|英|UK|加拿|美|日|JP|支持AI|法|德|澳)"
    include-all: true
    url: http://www.gstatic.com/generate_204
    interval: 1000
    tolerance: 50   # 延迟差 <50ms 不换（默认无 tolerance 就 0ms，很敏感）
    lazy: true
    timeout: 5
    max-failed-times: 3

  - name: Gemini
    type: url-test
    filter: "(105 日本|211 日本|316 英国|325 台湾|326 台湾|327 台湾|328 台湾|329 日本|香港0|支持AI)"
    include-all: true
    url: http://www.gstatic.com/generate_204
    interval: 1000
    tolerance: 50
    lazy: true
    timeout: 5
    max-failed-times: 3
  - name: 自动最快
    type: url-test
    include-all: true
    url: http://www.gstatic.com/generate_204
    interval: 1000
    tolerance: 50
    lazy: true
    timeout: 5
    max-failed-times: 3

  - name: Direct
    type: select
    proxies:
      - DIRECT
      - 自动最快

rule-providers:
  AdBlock: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/AdBlock.yaml', path: ./Rules/AdBlock, interval: 864000 }
  Apple: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/Apple.yaml', path: ./Rules/Apple, interval: 864000 }
  AI: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/AI.yaml', path: ./Rules/AI, interval: 864000 }
  Microsoft: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/Microsoft.yaml', path: ./Rules/Microsoft, interval: 864000 }
  China: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/China.yaml', path: ./Rules/China, interval: 864000 }
  Gemini: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/Gemini.yaml', path: ./Rules/Gemini, interval: 864000 }
  AdBlock2: { type: http, behavior: domain, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/AdBlock_Rule2.yaml', path: ./Rules/AD2, interval: 864000 }

rules:
  # 广告拦截最优先
  - RULE-SET,AdBlock,REJECT,no-resolve
  - RULE-SET,AdBlock2,REJECT,no-resolve

  # 重要厂商直连（避免延迟/功能异常）
  - RULE-SET,Apple,DIRECT,no-resolve
  - RULE-SET,Microsoft,DIRECT,no-resolve

  # AI / 特定服务强制走代理（即使国内）
  - RULE-SET,Gemini,Gemini
  - RULE-SET,AI,AI

  # 中国大陆域名直连
  - RULE-SET,China,DIRECT,no-resolve

  # 中国大陆 IP 直连（兜底地理规则）
  - GEOIP,CN,DIRECT,no-resolve
  - GEOIP,LAN,DIRECT,no-resolve

  # 最终兜底
  - MATCH,自动最快






















