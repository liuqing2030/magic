mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false

tun:
  enable: true
  stack: gvisor
  auto-route: true
  bypass-lan-addresses: true
  routing-mark: 666
  strict-route: true

proxy-providers:
  Provider_A:
    type: http
    url: "https://sub.iplcsub20241025.top/qC8zV8qS1kB1lX2u/NXy2N9NFBWZrEcio?clash=1"
    interval: 3600
    path: ./provider_a.yaml
    health-check: {enable: true, interval: 600, url: http://www.gstatic.com/generate_204}
  Provider_B:
    type: http
    url: "https://subscription.riolu.link/RioLU/system/api/v1/client/subscribe?token=a5dbbf3cfc45326d3f7721c095fcc0d8"
    interval: 3600
    path: ./provider_b.yaml
    health-check: {enable: true, interval: 600, url: http://www.gstatic.com/generate_204}
  Provider_C:
    type: http
    url: "https://dler.cloud/api/v3/download.getFile/80615782-a0f9-4dd6-9767-e1fca7decd6b?clash=smart&lv=2.png"
    interval: 3600
    path: ./provider_c.yaml
    health-check: {enable: true, interval: 600, url: http://www.gstatic.com/generate_204}

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  ipv6: false
  
  # 辅助解析（用于解析 DoH 域名 IP）
  default-nameserver: [223.5.5.5, 119.29.29.29]

  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://223.5.5.5/dns-query

  # 修正后的 nameserver-policy 格式
  nameserver-policy:
    "geosite:cn": [223.5.5.5, 119.29.29.29]
    "geosite:category-ads-all": "rcode://name_error"

  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "dler.cloud"
    - "+.dler.cloud"


profile:
  store-selected: true

proxy-groups:
  - name: AI
    type: url-test
    include-all: true
    filter: "(US|英|UK|加拿|美|日|JP|)"
    url: http://www.gstatic.com/generate_204
    interval: 300
  - name: Gemini
    type: url-test
    include-all: true
    filter: "(105 日本|211 日本|316 英国|325 台湾|326 台湾|327 台湾|328 台湾|329 日本|香港0|(支持AI))"
    url: http://www.gstatic.com/generate_204
    interval: 300
  - name: 自动最快
    type: url-test
    include-all: true
    url: http://www.gstatic.com/generate_204
    interval: 300
  - name: Direct
    type: select
    proxies:
      - DIRECT
      - 自动最快

rule-providers:
  AdBlock: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/AdBlock.yaml', path: ./Rules/AdBlock, interval: 86400 }
  Apple: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/Apple.yaml', path: ./Rules/Apple, interval: 86400 }
  AI: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/AI.yaml', path: ./Rules/AI, interval: 86400 }
  Microsoft: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/Microsoft.yaml', path: ./Rules/Microsoft, interval: 86400 }
  China: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/China.yaml', path: ./Rules/China, interval: 86400 }
  Gemini: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/Gemini', path: ./Rules/Gemini, interval: 86400 }

rules:
  - RULE-SET,AdBlock,REJECT
  - DOMAIN-KEYWORD,douyin,DIRECT
  - DOMAIN-KEYWORD,snssdk,DIRECT
  - DOMAIN-KEYWORD,amemv,DIRECT
  - DOMAIN-KEYWORD,pstatp,DIRECT
  - DOMAIN-KEYWORD,byteimg,DIRECT
  - DOMAIN-KEYWORD,bytegecko,DIRECT
  - DOMAIN-KEYWORD,volcwsccb,DIRECT
  - DOMAIN-KEYWORD,douyinvod,DIRECT
  - DOMAIN-KEYWORD,zijieapi,DIRECT
  - RULE-SET,China,DIRECT
  - RULE-SET,Microsoft,DIRECT
  - RULE-SET,Gemini,Gemini
  - RULE-SET,AI,AI
  - RULE-SET,Apple,自动最快
  - GEOIP,CN,DIRECT
  - MATCH,自动最快












