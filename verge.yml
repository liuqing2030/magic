mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false
# ---------------------------------------------------
tun:
  enable: true
  stack: gvisor
  auto-route: true
  # 强制让 10.x.x.x 的流量根本不经过 Clash 虚拟网卡
  bypass-lan-addresses: true
  routing-mark: 666
  strict-route: true
  process-name-filter:
    - "XFRHTX.exe"
    - "XFRHTXEx.exe"
# ---------------------------------------------------
proxy-providers:
  Provider_A:
    type: http
    url: "https://sub.iplcsub20241025.top/qC8zV8qS1kB1lX2u/NXy2N9NFBWZrEcio?clash=1" # iplcsub.
    interval: 3600
    path: ./provider_a.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204
  Provider_B:
    type: http
    url: "https://subscription.riolu.link/RioLU/system/api/v1/client/subscribe?token=a5dbbf3cfc45326d3f7721c095fcc0d8" # RioLU
    interval: 3600
    path: ./provider_b.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204
  Provider_C:
    type: http
    url: "https://dler.cloud/api/v3/download.getFile/80615782-a0f9-4dd6-9767-e1fca7decd6b?clash=smart&lv=2.png" # Delr cloud
    interval: 3600
    path: ./provider_c.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204
dns:
  enable: true
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  fake-ip-filter:
    - "*.ccb.com"
    - "*.icbc.com.cn"
    - "*.abchina.com.cn"
    - "*.bankofchina.com"
    - "*.95559.com.cn"
    - "*.cebbank.com"
    - "localhost"
    - "+.lan"
    - "+.local"
    - "*.weixin.qq.com"
    - "*.wechat.com"
    - "*.qpic.cn"
    - "short.weixin.qq.com"
    - "dns.weixin.qq.com"
    - "*.douyin.com"
    - "*.snssdk.com"
    - "*.amemv.com"
    - "*.ixigua.com"
    - "*.douyinvod.com"
    - "*.zijieapi.com"


  # 用于解析 DoH 域名本身（必须用明文DNS）
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    
  # 国内域名：明文DNS（速度快）
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 180.76.76.76  
    
  # 国外域名：加密DoH（防污染）
  fallback:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    - https://1.1.1.1/dns-query      # Cloudflare（最快）
    - https://8.8.8.8/dns-query      # Google
    - https://149.112.112.112/dns-query  # Quad9
  
  fallback-filter:
    geoip: true
    geoip-code: CN  # 当解析结果IP不在CN时，使用fallback    
    
# 关键：指定解析 DoH 域名时使用的服务器，防止死循环
  proxy-server-nameserver:
    - 223.5.5.5
    
  nameserver-policy:
    'geosite:cn': 223.5.5.5  # 国内域名用明文（快）

    # === 新增：明确指定国内大厂域名 ===
    # 抖音/字节系
    '+.douyin.com': 223.5.5.5
    '+.douyinpic.com': 223.5.5.5
    '+.douyinvod.com': 223.5.5.5
    '+.douyinstatic.com': 223.5.5.5
    '+.snssdk.com': 223.5.5.5
    '+.pstatp.com': 223.5.5.5
    '+.byteimg.com': 223.5.5.5
    '+.toutiao.com': 223.5.5.5
    '+.ixigua.com': 223.5.5.5
    '+.zijieapi.com': 223.5.5.5

    # 淘宝/阿里系
    '+.taobao.com': 223.5.5.5
    '+.tmall.com': 223.5.5.5
    '+.alicdn.com': 223.5.5.5
    '+.alipay.com': 223.5.5.5
    
    # 腾讯系
    '+.qq.com': 223.5.5.5
    '+.qpic.cn': 223.5.5.5
    '+.tencent.com': 223.5.5.5
    '+.gtimg.com': 223.5.5.5
    
    # 百度系
    '+.baidu.com': 223.5.5.5
    '+.bdstatic.com': 223.5.5.5
    
    # bilibili
    '+.bilibili.com': 223.5.5.5
    '+.hdslb.com': 223.5.5.5
    
    # 其他
    '+.jd.com': 223.5.5.5
    '+.meituan.com': 223.5.5.5
    '+.pinduoduo.com': 223.5.5.5
    '+.xiaohongshu.com': 223.5.5.5
    '+.kuaishou.com': 223.5.5.5
    
    'geosite:geolocation-!cn': 'https://223.5.5.5/dns-query'  # 国外域名用DoH（安全）


profile:
  store-selected: true
proxy-groups:
  - name: AI
    type: url-test
    include-all: true
    filter: "(US|美|英|UK|加拿)"
    url: http://www.gstatic.com/generate_204
    interval: 3000
    tolerance: 50
  - name: 自动最快
    type: url-test
    include-all: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: Direct
    type: select
    proxies:
      - DIRECT
      - 自动最快

rule-providers:
    AdBlock: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/AdBlock.yaml', path: ./Rules/AdBlock, interval: 86400 }
    Apple: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/Apple.yaml', path: ./Rules/Apple, interval: 86400 }
    AI: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/AI.yaml', path: ./Rules/AI, interval: 86400 }
    Microsoft: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/Microsoft.yaml', path: ./Rules/Microsoft, interval: 86400 }
    China: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/China.yaml', path: ./Rules/China, interval: 86400 }
    Proxy: { type: http, behavior: classical, url: 'https://raw.githubusercontent.com/liuqing2030/magic/refs/heads/main/proxy.yaml', path: ./Rules/Proxy, interval: 86400 }

rules:
  - DOMAIN-KEYWORD,douyin,DIRECT
  - DOMAIN-KEYWORD,snssdk,DIRECT
  - DOMAIN-KEYWORD,amemv,DIRECT
  - DOMAIN-KEYWORD,pstatp,DIRECT
  - DOMAIN-KEYWORD,byteimg,DIRECT
  - DOMAIN-KEYWORD,bytegecko,DIRECT
  - DOMAIN-KEYWORD,volcwsccb,DIRECT
  - DOMAIN-KEYWORD,douyinvod,DIRECT
  - DOMAIN-KEYWORD,zijieapi,DIRECT


  # 国内服务直连
  - RULE-SET,China,DIRECT
#
#  - RULE-SET,Proxy,自动最快
  - PROCESS-NAME,iCloudDrive.exe,自动最快
  - PROCESS-NAME,iCloudCKKS.exe,自动最快
  - RULE-SET,Apple,自动最快
  - RULE-SET,Microsoft,DIRECT
  - RULE-SET,AI,AI
  - RULE-SET,AdBlock,REJECT
  - DOMAIN-SUFFIX,clarity.ms,DIRECT
  - DOMAIN-SUFFIX,hawkingparty.com,DIRECT

  - GEOIP,CN,Direct
  - MATCH,自动最快
 




































